backend:
  name: github
  repo: Aether-254/me.abnt.it
  branch: main
  base_url: https://me.abnt.it
  auth_endpoint: api/auth

site_url: https://me.abnt.it
display_url: https://me.abnt.it
locale: zh_Hans
publish_mode: simple

media_folder: static/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    editor:
      preview: false
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: summary, label: 摘要, widget: text }
      - { name: tags, label: 标签, widget: list, default: [] }
      - { name: draft, label: 草稿, widget: boolean, default: false, required: false }
      - { name: body, label: 正文, widget: markdown }

  - name: site
    label: 站点配置
    files:
      - name: config
        label: site.ts
        file: src/lib/site.ts
        fields:
          - { name: body, label: 源码, widget: code, default_language: typescript, allow_language_selection: false, output_code_only: true }
